<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chojnicka Liga Halowa — 30. edycja</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<style>
:root{--g1:#f6dfa0;--g2:#e0b45c;--g3:#b8862e;--ink:#0b0a08;--ink2:#17140e;--cream:#f3ecd8;
--bg:#0b0a08;--panel:#17140e;--tx:#f3ecd8;--mu:#a89f84;--ln:rgba(224,180,92,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="light"]):not([data-theme="dark"]){--bg:#f7f1df;--panel:#fffdf6;--tx:#1a1305;--mu:#6d6347;--ln:rgba(184,134,46,.4)}}
:root[data-theme="dark"]{--bg:#0b0a08}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Poppins',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);border-bottom:1px solid var(--ln);color:var(--cream)}
.bar{max-width:1180px;margin:auto;padding:8px 20px;display:flex;align-items:center;gap:18px}
.bar img{height:46px;mix-blend-mode:screen;display:block}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:rgba(243,236,216,.8);text-decoration:none;font-size:13px;font-weight:600;padding:9px 12px;border-radius:999px;white-space:nowrap}
nav a.on{background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1305}
.fb{background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1305;font-weight:700;font-size:13px;padding:9px 16px;border-radius:8px;text-decoration:none;white-space:nowrap}
@media(max-width:900px){.fb{display:none}}
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 85% -10%,rgba(246,223,160,.35),transparent 55%),radial-gradient(ellipse at 10% 110%,rgba(184,134,46,.25),transparent 55%),linear-gradient(160deg,#0b0a08,#1c1608);color:var(--cream)}
.hero::before{content:"";position:absolute;top:-30%;left:-12%;width:30%;height:170%;background:linear-gradient(180deg,var(--g1),var(--g3));transform:rotate(24deg);opacity:.9;box-shadow:70px 0 0 -40px rgba(224,180,92,.5)}
.hero::after{content:"30";position:absolute;right:-2%;bottom:-18%;font-weight:900;font-style:italic;font-size:clamp(220px,34vw,430px);line-height:1;color:rgba(224,180,92,.07)}
.hi{position:relative;z-index:1;max-width:1180px;margin:auto;padding:72px 20px 80px 20%}
@media(max-width:800px){.hi{padding:60px 20px 64px 20px}.hero::before{width:60px;left:-20px;opacity:.7}}
.kick{font-size:12px;letter-spacing:.3em;font-weight:700;color:var(--g2);text-transform:uppercase}
.hero h1{font-size:clamp(38px,7vw,76px);font-weight:900;line-height:1;margin:14px 0 18px;text-transform:uppercase}
.gt{background:linear-gradient(180deg,var(--g1),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:480px;color:#cfc6ac;line-height:1.7}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.badge{font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid var(--ln)}
.badge.g{background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1305;border:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--ln);color:var(--cream)}
.btn.p{background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1305;border:0}
main{max-width:1180px;margin:auto;padding:0 20px}
section{padding:48px 0}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:12px}
h2{font-size:clamp(24px,4vw,32px);font-weight:900;margin:0;text-transform:uppercase;padding-left:16px;position:relative}
h2::before{content:"";position:absolute;left:0;top:.1em;bottom:.1em;width:6px;background:linear-gradient(180deg,var(--g1),var(--g3));transform:skewX(-12deg)}
.more{color:var(--g2);font-weight:700;font-size:13px;text-decoration:none}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.g3,.g4,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--ln);border-radius:14px;padding:18px}
.mc .top{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:12px;font-weight:600}
.mc .mid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:700;font-size:14px}
.mc .mid span:last-child{text-align:right}
.sc{font-weight:900;font-size:24px;padding:4px 12px;border-radius:8px;background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1305;font-style:italic}
.crest{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--g2);border:1px solid var(--g2);font-size:10px;font-weight:800;margin:0 6px;vertical-align:middle;flex-shrink:0}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead tr{background:var(--ink);color:var(--g2)}
th{font-size:11px;letter-spacing:.1em;padding:12px 10px;text-align:center}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:11px 10px;text-align:center;font-weight:600}
tbody tr:nth-child(odd){background:linear-gradient(90deg,#b8862e,#e0b45c);color:#1a1305}
tbody tr:nth-child(even){background:linear-gradient(90deg,#efe3bf,#faf3df);color:#1a1305}
tbody tr.cut td{border-top:3px solid #b3001b}
td.r{font-weight:900;font-size:16px}td.p{font-weight:900;font-size:16px}
td .crest{margin-left:0}
.leg{font-size:12px;color:var(--mu);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.f{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:5px;font-size:10px;font-weight:800;text-align:center;margin-right:3px;color:#fff}
.f.W{background:#2a9d6a}.f.D{background:#8a8470}.f.L{background:#c0392b}
.res{display:grid;grid-template-columns:1fr 84px 1fr;gap:6px;margin-bottom:8px;font-weight:700;font-size:14px}
.res>div{padding:12px 14px;background:linear-gradient(90deg,#b8862e,#e0b45c);color:#1a1305;display:flex;align-items:center;gap:6px}
.res>div:last-child{justify-content:flex-end;text-align:right;background:linear-gradient(270deg,#b8862e,#e0b45c)}
.res>div.s{justify-content:center;font-size:22px;font-weight:900;font-style:italic;background:linear-gradient(135deg,#f6dfa0,#b8862e)}
.pause{text-align:center;margin-top:14px;color:var(--mu);font-size:13px}.pause b{display:inline-block;margin-top:6px;padding:10px 26px;background:linear-gradient(90deg,#efe3bf,#faf3df);color:#1a1305;border-radius:6px}
.news .tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(224,180,92,.18);color:var(--g2)}
.news time{font-size:11px;color:var(--mu);margin-left:8px}
.news h3{margin:12px 0 8px;font-size:17px;font-weight:800}.news p{margin:0;font-size:13px;color:var(--mu);line-height:1.65}
.stat{background:linear-gradient(160deg,#17140e,#241b0a);border:1px solid var(--ln);border-radius:14px;padding:22px 10px;text-align:center}
.stat b{display:block;font-size:34px;font-weight:900;font-style:italic;background:linear-gradient(180deg,var(--g1),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:#cfc6ac}
.tm .big{display:flex;align-items:center;gap:10px;margin-bottom:12px}.tm .crest{width:44px;height:44px;font-size:13px;margin:0}
.tm h3{margin:0;font-size:16px;font-weight:800}.tm small{color:var(--mu)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--ln)}.kv span{color:var(--mu)}
.bartrack{height:10px;background:rgba(224,180,92,.15);border-radius:6px;overflow:hidden}.bartrack i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g1))}
.tl{border-left:2px solid var(--g2);padding-left:22px;margin-left:8px}.tl>div{position:relative;margin-bottom:26px}.tl>div::before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--g2);border:3px solid var(--bg)}
.tl b{font-size:13px;color:var(--g2)}.tl p{margin:4px 0 0;color:var(--mu);font-size:14px;line-height:1.6}
.sp{background:#bc955c;border-radius:14px;padding:14px 18px;text-align:center}.sp img{max-width:100%;height:auto;display:block;margin:auto}
.sp small{display:block;font-weight:800;letter-spacing:.18em;color:#3a2a0c;font-size:11px;margin-bottom:8px}
footer{background:var(--ink);color:#cfc6ac;margin-top:30px;border-top:2px solid var(--g2)}
.fi{max-width:1180px;margin:auto;padding:36px 20px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:13px}
.fi img{height:48px;mix-blend-mode:screen}.fi a{display:block;color:#cfc6ac;text-decoration:none;margin-bottom:6px}
.fb2{padding:14px 20px;border-top:1px solid var(--ln);text-align:center;font-size:12px;color:#8a8267}
.note{font-size:12px;color:var(--mu);margin-top:12px}
</style></head><body>

terminarz:()=>`<main><section>${sh("Terminarz")}${ROUNDS.map(r=>`<div class="card" style="margin-bottom:16px"><b style="color:var(--g2)">KOLEJKA ${r.n} · ${r.date}</b><div style="margin-top:12px">${resRows(r)}</div></div>`).join("")}<div class="card" style="text-align:center;color:var(--mu)">Kolejka ${last.n+1} i kolejne: terminarz zostanie opublikowany po ustaleniu terminów.</div></section>${sponsors}</main>`,
wyniki:()=>`<main><section>${sh("Wyniki")}${[...ROUNDS].reverse().map(r=>`<div class="card" style="margin-bottom:16px"><b style="color:var(--g2)">KOLEJKA ${r.n} · ${r.date}</b><div style="margin-top:12px">${resRows(r)}</div></div>`).join("")}</section>${sponsors}</main>`,
druzyny:()=>`<main><section>${sh("Drużyny")}<div class="grid g3">${TB.map(s=>{const m=ROUNDS.flatMap(r=>r.m).filter(x=>x[0]==s.k||x[1]==s.k).pop();return`<div class="card tm"><div class="big"><span class="crest">${T[s.k][1]}</span><div><h3>${nm(s.k)}</h3><small>Miejsce ${s.r} w tabeli</small></div></div><div class="kv"><span>Mecze</span><b>${s.m}</b></div><div class="kv"><span>Bilans (Z-R-P)</span><b>${s.w}-${s.d}-${s.l}</b></div><div class="kv"><span>Bramki</span><b>${s.gf}–${s.ga}</b></div><div class="kv"><span>Punkty</span><b>${s.p}</b></div><div class="kv"><span>Forma</span><span>${s.f.map(f=>`<i class="f ${f}">${f=="W"?"Z":f=="D"?"R":"P"}</i>`).join("")||"—"}</span></div><div class="kv"><span>Ostatni mecz</span><b>${m?`${nm(m[0]==s.k?m[1]:m[0])} ${m[0]==s.k?m[2]+":"+m[3]:m[3]+":"+m[2]}`:"pauza"}</b></div></div>`}).join("")}</div><div class="note">Herby i składy drużyn zostaną dodane po otrzymaniu materiałów od klubów.</div></section></main>`,
statystyki:()=>`<main><section>${sh("Statystyki sezonu")}${stats()}<div class="grid g3" style="margin-top:16px"><div class="card"><small style="color:var(--mu)">NAJWYŻSZE ZWYCIĘSTWO</small><h3 style="margin:8px 0 0">${nm(big[0])} ${big[2]}:${big[3]} ${nm(big[1])}</h3></div><div class="card"><small style="color:var(--mu)">NAJLEPSZY ATAK</small><h3 style="margin:8px 0 0">${nm(att.k)} (${att.gf} goli)</h3></div><div class="card"><small style="color:var(--mu)">NAJLEPSZA OBRONA</small><h3 style="margin:8px 0 0">${nm(def.k)} (${def.ga} straconych)</h3></div></div></section>
<section>${sh("Bramki zdobyte")}<div class="card">${[...TB].sort((a,b)=>b.gf-a.gf).map(s=>`<div style="display:grid;grid-template-columns:150px 1fr 24px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600"><span>${nm(s.k).split(" Kasacja")[0]}</span><div class="bartrack"><i style="width:${att.gf?s.gf/att.gf*100:0}%"></i></div><b>${s.gf}</b></div>`).join("")}</div></section>
<section>${sh("Klasyfikacja strzelców")}<div class="card" style="text-align:center;color:var(--mu)">Strzelcy i asystenci pojawią się po przesłaniu statystyk meczowych.</div></section></main>`,
historia:()=>`<main><section>${sh("Historia ligi")}<div class="tl"><div><b>2026/27</b><p>Jubileuszowa 30. edycja Chojnickiej Ligi Halowej. Inauguracja 31.10.2026, 11 drużyn, playoffy dla ośmiu najlepszych.</p></div><div><b>2023/24</b><p>Mistrzem został zespół Pro Efekt Piotrex.</p></div><div><b>Wcześniej</b><p>Tytuł mistrzowski zdobywali m.in. Dachy Szopiński. Pełna lista mistrzów zostanie uzupełniona.</p></div></div><div class="note">Pełna historia: lista mistrzów, najlepsi strzelcy i archiwalne tabele — do uzupełnienia na podstawie materiałów organizatora.</div></section></main>`,
kontakt:()=>`<main><section>${sh("Kontakt")}<div class="grid g2"><div class="card"><h3 style="margin-top:0">Facebook</h3><p style="color:var(--mu)">Aktualności, zdjęcia i relacje z kolejek.</p><a class="btn p" href="https://www.facebook.com/ChojnickaLigaHalowa/" target="_blank" rel="noopener">Chojnicka Liga Halowa</a></div><div class="card"><h3 style="margin-top:0">Strona ligi i transmisje</h3><p style="color:var(--mu)">Oficjalna strona: chlh.pl. Mecze są transmitowane w serwisie YouTube.</p><a class="btn" href="https://chlh.pl/" target="_blank" rel="noopener">chlh.pl</a></div></div><div class="note">Dane kontaktowe organizatora (e-mail, telefon) do uzupełnienia.</div></section>${sponsors}</main>`};
const NAV=[["start","Start"],["aktualnosci","Aktualności"],["tabela","Tabela"],["terminarz","Terminarz"],["wyniki","Wyniki"],["druzyny","Drużyny"],["statystyki","Statystyki"],["historia","Historia"],["kontakt","Kontakt"]];
function route(){const h=(location.hash||"#start").slice(1);const k=P[h]?h:"start";
 document.getElementById("nav").innerHTML=NAV.map(([a,l])=>`<a href="#${a}" class="${a==k?"on":""}">${l}</a>`).join("");
 document.getElementById("app").innerHTML=P[k]();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
